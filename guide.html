<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Coach Pon Guide</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="วิธีใช้แอป Coach Pon: Kickstart 7 วัน, ตารางฝึก, Meal tracker + AI, ติดตามผล และแชร์การ์ด">
  <meta name="theme-color" content="#d9d9d9">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Kanit:ital,wght@0,500;0,600;0,700;1,700&display=swap" rel="stylesheet">
  <style>
    /* สร้างจาก apps-script/App.html (ส่วน GUIDE) — แก้ที่ App.html แล้วสร้างไฟล์นี้ใหม่ */
    :root { --hot: #ff0080; --head: 'Kanit', 'IBM Plex Sans Thai', -apple-system, sans-serif; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: #d9d9d9; color: #000; font: 15px/1.6 'IBM Plex Sans Thai', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 13px 22px; cursor: pointer; }
    .btn { background: var(--hot); color: #fff; }
    .btn.soft { background: transparent; }
    .btn.block { width: 100%; }
    /* ---------- คู่มือการใช้งาน (สไลด์เต็มจอ โทนเทาอ่อนแบบนิตยสาร) ---------- */
    .guide { position: fixed; inset: 0; z-index: 70; background: #d9d9d9; color: #000; display: flex; flex-direction: column; }
    .g-track { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .g-track::-webkit-scrollbar { display: none; }
    .g-slide { flex: none; width: 100%; scroll-snap-align: start; overflow-y: auto; padding: calc(56px + env(safe-area-inset-top)) 26px 24px;
      background: radial-gradient(90% 60% at 100% 0%, rgba(255,255,255,.75), rgba(255,255,255,0) 70%), #d9d9d9; }
    .g-in { max-width: 460px; margin: 0 auto; }
    .g-top { position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 22px; right: 16px; display: flex; align-items: center; gap: 10px; z-index: 2; }
    .g-top b { font: italic 700 15px var(--head); letter-spacing: 2px; flex: 1; }
    .g-top b span { color: var(--hot); }
    .g-top img { width: 30px; height: 30px; object-fit: contain; }
    .g-top button { width: 38px; height: 38px; padding: 0; background: #000; color: #fff; font-size: 18px; }
    .g-kick { font: 600 13px var(--head); letter-spacing: 2px; text-transform: uppercase; color: rgba(0,0,0,.55); }
    .g-h { font: italic 700 46px/0.98 var(--head); text-transform: uppercase; margin: 6px 0 10px; letter-spacing: .5px; }
    .g-h span { color: var(--hot); }
    .g-p { color: rgba(0,0,0,.72); margin: 0 0 16px; }
    .g-list { list-style: none; padding: 0; margin: 14px 0 0; }
    .g-list li { position: relative; padding: 0 0 10px 22px; color: rgba(0,0,0,.8); font-size: 14px; }
    .g-list li::before { content: ''; position: absolute; left: 2px; top: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--hot); }
    .g-list b { color: #000; }
    .g-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .g-tile { background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 8px 22px rgba(0,0,0,.08); }
    .g-tile i { font-style: normal; font-size: 24px; }
    .g-tile b { display: block; font: 700 16px var(--head); text-transform: uppercase; margin-top: 4px; }
    .g-tile small { color: rgba(0,0,0,.6); font-size: 12px; line-height: 1.4; display: block; }
    .g-steps { counter-reset: s; }
    .g-step { display: flex; gap: 14px; align-items: flex-start; background: #fff; border-radius: 18px; padding: 14px; margin-bottom: 10px; box-shadow: 0 8px 22px rgba(0,0,0,.07); }
    .g-step::before { counter-increment: s; content: counter(s); flex: none; width: 34px; height: 34px; border-radius: 50%; background: #000; color: #fff; display: grid; place-items: center; font: 700 16px var(--head); }
    .g-step b { display: block; }
    .g-step small { color: rgba(0,0,0,.62); }
    .g-phone { width: 190px; margin: 4px auto 6px; background: #000; border-radius: 30px; padding: 12px 10px; box-shadow: 0 22px 44px rgba(0,0,0,.28); color: #fff; font-size: 10px; }
    .g-phone .gp { background: rgba(255,255,255,.09); border-radius: 12px; padding: 8px; margin-bottom: 6px; }
    .g-phone .gp b { font: italic 700 20px/1 var(--head); display: block; }
    .g-phone .gp b span, .g-phone .pk { color: var(--hot); }
    .g-phone .gbar { height: 5px; border-radius: 9px; background: rgba(255,255,255,.15); margin-top: 5px; overflow: hidden; }
    .g-phone .gbar i { display: block; height: 100%; background: var(--hot); }
    .g-phone .gks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .g-phone .gks span { aspect-ratio: 1; border-radius: 6px; background: rgba(255,255,255,.12); display: grid; place-items: center; font-weight: 700; }
    .g-phone .gks span.on { background: var(--hot); }
    .g-phone .gimg { height: 64px; border-radius: 10px; background: radial-gradient(circle at 35% 40%, #f7c873 0 18%, transparent 19%), radial-gradient(circle at 65% 55%, #8bc34a 0 16%, transparent 17%), radial-gradient(circle at 50% 50%, #fff 0 38%, #333 39%); }
    .g-check { display: flex; gap: 12px; align-items: center; background: #fff; border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; font-weight: 500; width: 100%; text-align: left; color: #000; }
    .g-check i { flex: none; width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0,0,0,.2); display: grid; place-items: center; font-style: normal; color: #fff; font-size: 14px; }
    .g-check.on i { background: var(--hot); box-shadow: none; }
    .g-foot { display: flex; align-items: center; gap: 12px; padding: 12px 22px calc(14px + env(safe-area-inset-bottom)); background: #d9d9d9; }
    .g-dots { flex: 1; display: flex; gap: 5px; flex-wrap: wrap; }
    .g-dots i { width: 7px; height: 7px; border-radius: 9px; background: rgba(0,0,0,.2); transition: width .2s; }
    .g-dots i.on { width: 22px; background: var(--hot); }
    .g-foot .btn.soft { color: #000; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.25); }

  </style>
</head>
<body>
  <script>
    const $ = (sel) => document.querySelector(sel);
    /* GUIDE-START: สไลด์คู่มือ (ใช้ร่วมกับหน้าเว็บ guide.html) */
    const G_LOGO = ['https:', '', 'aoponpol-lgtm.github.io', 'coach-pon', 'img', 'logo-pink.png'].join('/');
    const G_SITE = 'aoponpol-lgtm.github.io/coach-pon';
    const gPhone = (inner) => `<div class="g-phone">${inner}</div>`;
    const GUIDE = [
      { k: 'Coach Pon App · Guide', h: 'Everything<br>you <span>need</span>', p: 'แอปเดียวจบ ฝึก กิน ติดตามผล และคุยกับครูพล ออกแบบให้ใช้ง่ายบนมือถือ',
        v: gPhone(`<div class="gp"><small>สวัสดี 👋</small><b>WEEK <span>3</span></b><div class="gbar"><i style="width:60%"></i></div></div>
          <div class="gp"><small>วันนี้กินไปแล้ว</small><b>1,155 <span style="font-size:11px">/ 1,600</span></b><div class="gbar"><i style="width:72%"></i></div></div>
          <div class="gp"><small>🔥 ติดต่อกัน 6 ครั้ง</small></div>`),
        list: ['ปัดซ้ายเพื่อดูวิธีใช้ทีละขั้น', 'เปิดคู่มือนี้ได้ทุกเมื่อจากวงกลม <b>วิธีใช้</b> บนหน้าแรก'] },
      { k: 'What\'s inside', h: 'All in<br>one <span>place</span>', p: 'ทุกอย่างที่ช่วยให้คุณไปถึงเป้าหมาย',
        v: `<div class="g-grid">
          <div class="g-tile"><i>🔥</i><b>Kickstart</b><small>7 วันเริ่มต้น ทำที่บ้านได้</small></div>
          <div class="g-tile"><i>🏋️</i><b>Workout</b><small>การ์ดวันฝึก + ตัวจับเวลา</small></div>
          <div class="g-tile"><i>🍽</i><b>Meal</b><small>นับแคลอรี่ด้วย AI จากรูป</small></div>
          <div class="g-tile"><i>📈</i><b>Progress</b><small>น้ำหนัก สถิติ เหรียญ</small></div>
          <div class="g-tile" style="grid-column:1/-1"><i>💬</i><b>Coach</b><small>ครูพลดูข้อมูลของคุณและปรับแผนให้</small></div></div>` },
      { k: 'Getting started', h: 'How to<br><span>start</span>', p: 'เริ่มได้ใน 3 ขั้นตอน',
        v: `<div class="g-steps">
          <div class="g-step"><div><b>เปิดเว็บ</b><small>${G_SITE}</small></div></div>
          <div class="g-step"><div><b>Sign up</b><small>กรอกข้อมูลร่างกายและเป้าหมาย ระบบคำนวณแผนให้ทันที</small></div></div>
          <div class="g-step"><div><b>Sign in</b><small>ด้วย Google หรืออีเมล + รหัสผ่าน ครั้งต่อไปเข้าได้เลย</small></div></div></div>` },
      { k: 'Install', h: 'Add to<br>home <span>screen</span>', p: 'ใช้เหมือนแอปจริง เปิดเร็ว ไม่ต้องค้นหาเว็บ',
        v: `<div class="g-steps">
          <div class="g-step"><div><b>iPhone (Safari)</b><small>กดปุ่มแชร์ ⬆︎ → "เพิ่มไปยังหน้าจอโฮม" → เพิ่ม</small></div></div>
          <div class="g-step"><div><b>Android (Chrome)</b><small>กด ⋮ มุมขวาบน → "เพิ่มลงในหน้าจอหลัก"</small></div></div>
          <div class="g-step"><div><b>เปิดจากไอคอน Coach Pon</b><small>ระบบจำการเข้าสู่ระบบไว้ 30 วัน</small></div></div></div>` },
      { k: 'Your plan', h: 'Know your<br><span>numbers</span>', p: 'แผนแคลอรี่และสารอาหารที่คำนวณจากร่างกายของคุณ',
        v: gPhone(`<div class="gp"><small>My plan</small><b>1,600 <span style="font-size:11px">kcal/วัน</span></b></div>
          <div class="gp">โปรตีน <span class="pk">110g</span><div class="gbar"><i style="width:80%"></i></div>คาร์บ 170g<div class="gbar"><i style="width:60%;background:#fff"></i></div>ไขมัน 45g<div class="gbar"><i style="width:40%"></i></div></div>`),
        list: ['<b>BMR</b> พลังงานที่ร่างกายใช้ขณะพัก', '<b>TDEE</b> พลังงานที่ใช้ทั้งวันรวมกิจกรรม', 'แผนนี้ปลอดภัย ไม่ต่ำกว่า BMR · วัด InBody กับครูพลจะแม่นขึ้น'] },
      { k: 'Free program', h: '7-Day<br><span>Kickstart</span>', p: 'วันละ 20–30 นาที ไม่ต้องมีอุปกรณ์ เลือกระดับ "เพิ่งเริ่ม" หรือ "มีพื้นฐาน"',
        v: gPhone(`<div class="gp"><small>7-Day Kickstart</small><b>DAY <span>4</span></b></div>
          <div class="gks"><span class="on">✓</span><span class="on">✓</span><span class="on">✓</span><span>4</span><span>5</span><span>6</span><span>7</span></div>`),
        list: ['กดวันนั้น → ดูท่า วิธีทำ → กด <b>จบการฝึก</b>', 'ทำครบ 7/7 รับการ์ดแชร์พิเศษ และสิทธิ์คุยกับครูพล'] },
      { k: 'Training', h: 'Workout<br>+ <span>timer</span>', p: 'ทุกวันฝึกมีท่า เซต ครั้ง และเวลาพัก พร้อมคำอธิบาย',
        v: gPhone(`<div class="gp"><small>A · ต้องทำ</small><b style="font-size:14px">Hip Thrust</b>3 × 10 · RPE 7 <span class="pk">⏱ 90 วิ</span></div>
          <div class="gp" style="text-align:center"><b>01:30</b><small>พักก่อน 😮‍💨</small></div>`),
        list: ['กด <b>⏱</b> ข้างท่าเพื่อจับเวลาพักเต็มจอ', 'มีเสียงครูพลบอก "หมดเวลาพักแล้ว" (เปิดเสียงเครื่องไว้)', 'กรอกน้ำหนัก/ครั้งที่ทำได้ โค้ชจะเห็นและปรับโปรแกรมให้'] },
      { k: 'Nutrition', h: 'Meal<br><span>tracker</span>', p: 'ถ่ายรูปอาหาร AI ช่วยประเมินแคลอรี่และสารอาหาร',
        v: gPhone(`<div class="gimg"></div><div class="gp" style="margin-top:6px"><small>✨ AI Scan</small><b style="font-size:14px">ข้าวกะเพราไก่ไข่ดาว</b>650 kcal · P 32 · C 70 · F 26</div>`),
        list: ['แท็บ <b>อาหาร</b> → <b>📷 AI Scan</b> → ตรวจแก้ตัวเลข → บันทึก', 'ดูสรุป วันนี้ / สัปดาห์นี้ / เดือนนี้ แตะวันไหนก็เห็นมื้อของวันนั้น', 'ไม่อยากถ่ายรูป กด <b>＋ เพิ่มมื้อ</b> กรอกเองได้'] },
      { k: 'Progress', h: 'Track your<br><span>progress</span>', p: 'เห็นความเปลี่ยนแปลงชัดเจน ทุกสัปดาห์',
        v: gPhone(`<div class="gp"><small>⚖️ น้ำหนัก</small><svg viewBox="0 0 120 40" style="width:100%"><polyline points="2,8 22,12 42,15 62,20 82,24 102,27 118,30" fill="none" stroke="#ff0080" stroke-width="3" stroke-linecap="round"/></svg></div>
          <div class="gp"><small>🏅 เหรียญ 5 · 10 · 25</small></div>`),
        list: ['บันทึกน้ำหนักสัปดาห์ละ 1–2 ครั้ง ตอนเช้าก่อนกินอาหาร', 'ฝึกสะสมครบ 5 / 10 / 25 / 50 / 100 ครั้ง รับเหรียญ'] },
      { k: 'Share', h: 'Share &<br><span>invite</span>', p: 'สร้างการ์ด IG Story สวย ๆ จากแผนและความสำเร็จของคุณ',
        v: gPhone(`<div class="gp" style="text-align:center;padding:14px 8px"><b>7<span>/7</span></b><small>KICKSTART COMPLETE</small><div style="width:38px;height:38px;margin:8px auto 0;background:repeating-linear-gradient(90deg,#fff 0 3px,#000 3px 6px);border-radius:4px"></div></div>`),
        list: ['กด <b>📸 แชร์</b> → เลือกการ์ด → แชร์ลง IG Story', 'การ์ดมี QR ให้เพื่อนสแกนสมัครได้ทันที'] },
      { k: 'Members only', h: 'Coach Pon<br><span>club</span>', p: 'พื้นที่เฉพาะลูกเทรนของครูพล',
        v: `<div class="g-grid"><div class="g-tile"><i>📅</i><b>12 weeks</b><small>ตารางฝึกระยะยาวในปฏิทิน</small></div>
          <div class="g-tile"><i>🎯</i><b>Personal</b><small>โปรแกรมเฉพาะคุณ</small></div>
          <div class="g-tile"><i>📊</i><b>InBody</b><small>ติดตามผลวัดร่างกาย</small></div>
          <div class="g-tile"><i>💬</i><b>Feedback</b><small>ครูพลคอมเมนต์ทุกสัปดาห์</small></div></div>`,
        list: ['สมาชิกเห็นตัวอย่างในแท็บ 🔒 <b>Club</b>', 'กด "จองเวลาคุยกับครูพล" เพื่อเริ่มเทรนและปลดล็อก'] },
      { k: 'Ready', h: 'You\'re<br>all <span>set</span>', p: 'เช็กลิสต์เริ่มต้น แตะเพื่อติ๊ก', check: true },
    ];
    let GI = 0;
    function guideChecklist() {
      if (typeof appChecklist === 'function') return appChecklist();
      return [['ตั้งเป้าหมายและแผนแคลอรี่', true], ['เพิ่มไอคอนบนหน้าจอ', false], ['เริ่มฝึกวันแรก', false], ['บันทึกมื้ออาหารแรก', false], ['บันทึกน้ำหนัก', false]];
    }
    function openGuide(start, onDone) {
      closeGuide();
      const el = document.createElement('div');
      el.className = 'guide';
      el.id = 'guide';
      const checks = guideChecklist();
      el.innerHTML = `<div class="g-top"><b>KRU<span>PON</span></b><img src="${G_LOGO}" alt=""><button aria-label="ปิด" onclick="closeGuide()">✕</button></div>
        <div class="g-track" id="g-track">${GUIDE.map((g, i) => `<section class="g-slide"><div class="g-in">
          <div class="g-kick">${String(i + 1).padStart(2, '0')} · ${g.k}</div>
          <div class="g-h">${g.h}</div><p class="g-p">${g.p}</p>
          ${g.v || ''}
          ${g.list ? `<ul class="g-list">${g.list.map((x) => `<li>${x}</li>`).join('')}</ul>` : ''}
          ${g.check ? checks.map((c) => `<button class="g-check ${c[1] ? 'on' : ''}" onclick="this.classList.toggle('on')"><i>✓</i>${c[0]}</button>`).join('')
            + '<button class="btn block" style="margin-top:14px;font:italic 700 20px var(--head);letter-spacing:1px" onclick="closeGuide(true)">START NOW →</button>' : ''}
        </div></section>`).join('')}</div>
        <div class="g-foot"><div class="g-dots" id="g-dots">${GUIDE.map((_, i) => `<i data-i="${i}"></i>`).join('')}</div>
          <button class="btn soft" id="g-prev">‹</button><button class="btn" id="g-next">ถัดไป</button></div>`;
      document.body.appendChild(el);
      GUIDE_DONE = onDone || null;
      const tr = $('#g-track');
      const sync = () => {
        GI = Math.round(tr.scrollLeft / tr.clientWidth);
        el.querySelectorAll('#g-dots i').forEach((d, i) => d.classList.toggle('on', i === GI));
        $('#g-prev').style.visibility = GI ? 'visible' : 'hidden';
        $('#g-next').textContent = GI >= GUIDE.length - 1 ? 'เริ่มเลย' : 'ถัดไป';
      };
      tr.addEventListener('scroll', () => requestAnimationFrame(sync), { passive: true });
      const goTo = (i) => tr.scrollTo({ left: i * tr.clientWidth, behavior: 'smooth' });
      $('#g-prev').onclick = () => goTo(Math.max(0, GI - 1));
      $('#g-next').onclick = () => (GI >= GUIDE.length - 1 ? closeGuide(true) : goTo(GI + 1));
      requestAnimationFrame(() => { tr.scrollLeft = (start || 0) * tr.clientWidth; sync(); });
    }
    let GUIDE_DONE = null;
    function closeGuide(done) {
      const el = $('#guide');
      if (el) el.remove();
      if (done && GUIDE_DONE) GUIDE_DONE();
    }

    openGuide(Number((location.hash.match(/\d+/) || [1])[0]) - 1 || 0, () => { location.href = './'; });
    window.closeGuide = function (done) { location.href = './'; };
  </script>
</body>
</html>
